[project]
name = "sightline-ai"
version = "0.4.0"
description = "Local visual intelligence for Windows; CPU inference and strict QNN verification"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "onnxruntime==1.30.0", "opencv-python-headless==4.12.0.88", "Pillow==12.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["hardware: requires Snapdragon hardware and a compatible QNN runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/reference/*" = ["B905"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "scripts"]
